[project]
name = "eap-backend"
version = "0.1.0"
description = "EAP backend — FastAPI application"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.30",
    "blinker>=1.8",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pgvector>=0.2.5",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.9",
    "redis>=5.0",
    "rq>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=24.4",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection calls factories/constructors in argument defaults
# by design; B008's "immutable default" concern does not apply to them.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "app.dependencies.require_roles",
]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true
