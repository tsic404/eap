server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. A literal upstream name in proxy_pass is resolved
    # once at startup and pinned forever, so a restarted container (new IP)
    # yields 502 until nginx is restarted. /api/ therefore proxies through the
    # $backend_upstream variable to force per-request resolution; valid=5s
    # overrides Docker DNS's 600s TTL to bound the stale window.
    resolver 127.0.0.11 ipv6=off valid=5s;
    resolver_timeout 5s;

    # Internal liveness probe for the nginx container itself.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Upload endpoints → backend. The application judges the body (15 MiB cap →
    # 422 FILE_TOO_LARGE), so this ceiling must sit above the app's budget
    # (15 MiB + 64 KiB envelope) and above 20 MiB, or nginx answers 413 before
    # the size gate can run. Only these two routes are opened up: every other
    # API route keeps nginx's 1 MB default, so no JSON body is amplified.
    location ~ ^/api/(files/upload|knowledge-bases/[^/]+/documents)$ {
        client_max_body_size 21m;
        set $backend_upstream http://backend:3001;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API requests → backend (FastAPI on :3001)
    location /api/ {
        set $backend_upstream http://backend:3001;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else → frontend (Next.js on :3000)
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
