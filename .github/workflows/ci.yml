name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build

  backend:
    name: Backend (lint / typecheck / test / migration / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: eap
          POSTGRES_PASSWORD: eap_password
          POSTGRES_DB: eap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eap -d eap"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --extra dev --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: ruff check .

      - name: Typecheck
        run: mypy app

      - name: Test
        run: pytest -m "not perf"

      - name: Performance gate (Agent list P95 < 240ms)
        run: pytest -m perf

      - name: Migration smoke test (upgrade → downgrade)
        env:
          DATABASE_URL: postgresql+asyncpg://eap:eap_password@localhost:5432/eap
        run: |
          alembic upgrade head
          python - <<'PY'
          import asyncio

          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine

          COMPOSITE_FKS = {
              "fk_agent_registry_tenant_created_by_users",
              "fk_tool_registry_tenant_created_by_users",
              "fk_tasks_tenant_creator_id_users",
              "fk_tasks_tenant_assignee_id_users",
              "fk_user_memories_tenant_user_id_users",
              "fk_audit_logs_tenant_user_id_users",
              "fk_run_logs_tenant_agent_id_agent_registry",
              "fk_run_logs_tenant_user_id_users",
          }

          async def main() -> None:
              engine = create_async_engine(
                  "postgresql+asyncpg://eap:eap_password@localhost:5432/eap"
              )
              async with engine.connect() as conn:
                  validated = (
                      await conn.execute(
                          text(
                              "SELECT conname FROM pg_constraint "
                              "WHERE contype = 'f' AND convalidated = true"
                          )
                      )
                  ).scalars().all()
                  missing = COMPOSITE_FKS - set(validated)
                  assert not missing, (
                      f"composite FKs missing or unvalidated: {sorted(missing)}"
                  )
              await engine.dispose()

          asyncio.run(main())
          PY
          alembic downgrade base
          alembic upgrade head

      - name: Migration deploy (retry ×3)
        env:
          DATABASE_URL: postgresql+asyncpg://eap:eap_password@localhost:5432/eap
        run: |
          alembic downgrade base
          for attempt in 1 2 3; do
            if alembic upgrade head; then
              echo "alembic upgrade succeeded on attempt $attempt"
              exit 0
            fi
            echo "alembic upgrade attempt $attempt failed; retrying in 5s"
            sleep 5
          done
          echo "alembic upgrade failed after 3 attempts"
          exit 1

      - name: Build
        run: uv build --wheel

  e2e:
    name: E2E (SSO regression)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: eap
          POSTGRES_PASSWORD: eap_password
          POSTGRES_DB: eap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eap -d eap"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -e "./apps/backend[dev]"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chrome
        run: npx playwright install --with-deps chrome

      - name: Run SSO e2e regression
        run: pnpm -C apps/frontend test:e2e
        env:
          # The e2e harness owns a dedicated disposable database (eap_e2e); the
          # global-setup guard refuses any non-disposable name without opt-in.
          # Redis is self-managed too: global-setup starts its own throwaway
          # redis:7-alpine container, exercising the container path in CI.
          E2E_PSQL_DSN: postgresql://eap:eap_password@localhost:5432/eap_e2e
          E2E_DATABASE_URL: postgresql+asyncpg://eap:eap_password@localhost:5432/eap_e2e

  docker:
    name: Docker (build + push)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-backend:${{ github.sha }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-frontend:${{ github.sha }}
