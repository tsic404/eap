name: eap

# Shared environment for both Dify processes. The Dify api image runs either
# `MODE: api` (HTTP) or `MODE: worker` (Celery) from the same image. In Dify 1.x
# model/tool plugins run out-of-process in `plugin-daemon`, which keeps its own
# `dify_plugin` database; the api and worker reach it over the compose network
# (PLUGIN_DAEMON_URL / PLUGIN_DAEMON_KEY) and let it call back through the
# shared inner-API key (INNER_API_KEY_FOR_PLUGIN). Without the daemon every
# model-manager call (dataset create, model listing, chat generation) fails.
#
# Secrets have no hardcoded fallback: `${VAR:?...}` makes `docker compose` fail
# fast when the value is missing/empty, so the stack never boots with a known
# default key.
x-dify-env: &dify-env
  LOG_LEVEL: INFO
  SECRET_KEY: ${DIFY_SECRET_KEY:?DIFY_SECRET_KEY must be set in .env}
  MIGRATION_ENABLED: "true"
  DB_TYPE: postgresql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USERNAME: ${POSTGRES_USER:-eap}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-eap_password}
  DB_DATABASE: dify
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  CELERY_BROKER_URL: redis://redis:6379/1
  VECTOR_STORE: weaviate
  WEAVIATE_ENDPOINT: http://weaviate:8080
  WEAVIATE_API_KEY: ${WEAVIATE_API_KEY:?WEAVIATE_API_KEY must be set in .env}
  STORAGE_TYPE: local
  STORAGE_LOCAL_PATH: storage
  FILES_URL: ""
  PLUGIN_DAEMON_URL: http://plugin-daemon:5002
  PLUGIN_DAEMON_KEY: ${PLUGIN_DAEMON_KEY:?PLUGIN_DAEMON_KEY must be set in .env}
  INNER_API_KEY_FOR_PLUGIN: ${PLUGIN_DIFY_INNER_API_KEY:?PLUGIN_DIFY_INNER_API_KEY must be set in .env}
  # Plugin remote-install (browser plugin debugging) is not wired: it needs the
  # daemon's 5003 published on the host plus a browser-reachable host value, so
  # PLUGIN_REMOTE_INSTALL_HOST/PORT are left at Dify's defaults.
  PLUGIN_MAX_PACKAGE_SIZE: ${PLUGIN_MAX_PACKAGE_SIZE:-52428800}

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost/api}
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    expose:
      - "3001"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://eap:eap_password@postgres:5432/eap}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DIFY_API_BASE_URL: ${DIFY_API_BASE_URL:-http://dify-api:5001}
      DIFY_API_KEY: ${DIFY_API_KEY:-}
      DIFY_CONSOLE_EMAIL: ${DIFY_CONSOLE_EMAIL:-}
      DIFY_CONSOLE_PASSWORD: ${DIFY_CONSOLE_PASSWORD:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost/api/auth/callback}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/api/health/live')",
        ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  dify-api:
    image: langgenius/dify-api:1.17.0
    environment:
      <<: *dify-env
      MODE: api
    volumes:
      - dify_api_storage:/app/api/storage
    depends_on:
      dify-db-init:
        condition: service_completed_successfully
      init_permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5001/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  dify-worker:
    image: langgenius/dify-api:1.17.0
    command: >-
      celery -A app.celery worker -P gevent -c 1 --loglevel INFO
      -Q dataset,generation,mail,ops_trace,plugin
    environment:
      <<: *dify-env
      MODE: worker
    volumes:
      - dify_api_storage:/app/api/storage
    depends_on:
      dify-db-init:
        condition: service_completed_successfully
      init_permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    # Gotcha: this probe checks Redis reachability, not worker liveness — a
    # hung Celery process still reads healthy. The prior
    # `celery -A app.celery inspect ping` was dropped because it always fails
    # here (`mingle: all alone`, exit 125) even when the worker is fine.
    # Worker process death is covered by `restart: unless-stopped`.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, redis; redis.from_url(os.environ['CELERY_BROKER_URL']).ping()",
        ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  # One-shot: Dify's api/worker connect to `dify` and the plugin daemon to
  # `dify_plugin`, but Postgres only auto-creates POSTGRES_DB (`eap`). Both are
  # created here, idempotently, on every bring-up — so this also repairs a
  # volume initialized before the plugin daemon (and its database) existed.
  dify-db-init:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-eap_password}
    volumes:
      - ./deploy/postgres/bootstrap-databases.sql:/bootstrap.sql:ro
    command:
      [
        "psql",
        "-h",
        "postgres",
        "-U",
        "${POSTGRES_USER:-eap}",
        "-d",
        "postgres",
        "-v",
        "ON_ERROR_STOP=1",
        "-f",
        "/bootstrap.sql",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # One-shot: the Dify api/worker images run as uid 1001 (`dify`), so their
  # storage volume must be owned by that uid before either process writes an
  # uploaded file into it. Flag-file guarded, so the recursive chown runs once
  # per volume rather than on every bring-up.
  init_permissions:
    image: alpine:3.20
    command:
      - sh
      - -c
      - |
        FLAG_FILE="/app/api/storage/.init_permissions"
        if [ -f "$${FLAG_FILE}" ]; then
          echo "Permissions already initialized. Exiting."
          exit 0
        fi
        chown -R 1001:1001 /app/api/storage && touch "$${FLAG_FILE}"
        echo "Permissions initialized. Exiting."
    volumes:
      - dify_api_storage:/app/api/storage
    restart: "no"

  # Dify 1.x model/tool plugins run out-of-process here. Every model-manager
  # call the api makes (dataset creation, model listing, chat generation) is
  # proxied to this daemon, so it is required for KB and conversation features.
  plugin-daemon:
    image: langgenius/dify-plugin-daemon:0.6.10-local
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: ${POSTGRES_USER:-eap}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-eap_password}
      DB_DATABASE: dify_plugin
      DB_SSL_MODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_PASSWORD: ""
      REDIS_USE_SSL: "false"
      SERVER_PORT: "5002"
      SERVER_KEY: ${PLUGIN_DAEMON_KEY:?PLUGIN_DAEMON_KEY must be set in .env}
      DIFY_INNER_API_URL: http://dify-api:5001
      DIFY_INNER_API_KEY: ${PLUGIN_DIFY_INNER_API_KEY:?PLUGIN_DIFY_INNER_API_KEY must be set in .env}
      PLUGIN_REMOTE_INSTALLING_HOST: 0.0.0.0
      PLUGIN_REMOTE_INSTALLING_PORT: "5003"
      PLUGIN_WORKING_PATH: /app/storage/cwd
      PLUGIN_STORAGE_TYPE: local
      PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
      PLUGIN_INSTALLED_PATH: plugin
      PLUGIN_PACKAGE_CACHE_PATH: plugin_packages
      PLUGIN_MEDIA_CACHE_PATH: assets
      MAX_PLUGIN_PACKAGE_SIZE: ${PLUGIN_MAX_PACKAGE_SIZE:-52428800}
      PLUGIN_MAX_EXECUTION_TIMEOUT: "600"
      PYTHON_ENV_INIT_TIMEOUT: "120"
      FORCE_VERIFYING_SIGNATURE: "true"
    volumes:
      - plugin_daemon_storage:/app/storage
    depends_on:
      dify-db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5002/health/check"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eap_password}
      POSTGRES_DB: ${POSTGRES_DB:-eap}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eap} -d ${POSTGRES_DB:-eap}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  weaviate:
    image: semitechnologies/weaviate:1.24.10
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_API_KEY:?WEAVIATE_API_KEY must be set in .env}
      AUTHENTICATION_APIKEY_USERS: ${WEAVIATE_API_USER:-eap@example.com}
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
    volumes:
      - weaviadata:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  weaviadata:
  dify_api_storage:
  plugin_daemon_storage:
